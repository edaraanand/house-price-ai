model:
  name: california_housing_model

dataset:
  name: california_housing
  test_size: 0.2
  random_state: 42

training:

  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    random_state: 42

  random_forest:
    n_estimators: 300
    max_depth: 15
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: 1.0
    random_state: 42
    n_jobs: -1

  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 31
    max_depth: null
    l2_regularization: 0.0
    random_state: 42

tuning:
  max_workers: 4

  xgboost:
    max_depth:
      - 4
      - 6
      - 8

    learning_rate:
      - 0.01
      - 0.05
      - 0.1

    n_estimators:
      - 300
      - 600

  random_forest:
    n_estimators:
      - 200
      - 300
      - 500

    max_depth:
      - 10
      - 15
      - 20

    min_samples_split:
      - 2
      - 5

  hist_gradient_boosting:
    max_iter:
      - 200
      - 300
      - 500

    learning_rate:
      - 0.03
      - 0.05
      - 0.1

    max_leaf_nodes:
      - 15
      - 31
      - 63

evaluation:
  primary_metric: rmse
  min_rmse_improvement: 0.05
  min_r2: 0.50
