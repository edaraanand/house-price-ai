apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-serving
  namespace: mlops
  labels:
    app: house-price-serving

spec:
  replicas: 1

  selector:
    matchLabels:
      app: house-price-serving

  template:
    metadata:
      labels:
        app: house-price-serving

    spec:
      containers:
        - name: house-price-serving
          image: edaraanand/house-price-ai:72cb042
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-mlflow.mlflow.svc.cluster.local:5000"

            - name: MLFLOW_MODEL_NAME
              value: "california_housing_ai"

            - name: MLFLOW_MODEL_ALIAS
              value: "production"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
